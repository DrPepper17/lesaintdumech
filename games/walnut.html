<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Walnut – Ernest Pointe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{--bg:#d9d5ea;--ink:#2a2640;--btn:#f4f1fb;--edge:#2a2640;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171526;--ink:#cfc9ee;--btn:#2b2745;--edge:#8f87c9}}
:root[data-theme="dark"]{--bg:#171526;--ink:#cfc9ee;--btn:#2b2745;--edge:#8f87c9}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Press Start 2P",ui-monospace,Menlo,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;border:4px solid var(--edge);border-radius:6px;background:#000;max-width:100%}
.hint{font-size:8px;line-height:1.8;text-align:center;max-width:90vw}
.pad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:4px}
.pad button,.a{background:var(--btn);color:var(--ink);border:2px solid var(--edge);border-radius:8px;font:inherit;font-size:12px;touch-action:none}
.pad button:active,.a:active{transform:translateY(1px);filter:brightness(.9)}
.row{display:flex;gap:28px;align-items:center}
.a{width:56px;height:56px;border-radius:50%;font-size:14px}
@media (hover:hover) and (pointer:fine){.row{display:none}}
</style>
</head>
<body>
<canvas id="c" width="240" height="160" aria-label="Game screen"></canvas>
<div class="hint">Arrow keys or WASD to <u>Walk</u>.<br>Z, Space or Return/Enter to <u>Interact</u>.</div>
<div class="row">
  <div class="pad">
    <span></span><button data-k="up" aria-label="Up">▲</button><span></span>
    <button data-k="left" aria-label="Left">◀</button><span></span><button data-k="right" aria-label="Right">▶</button>
    <span></span><button data-k="down" aria-label="Down">▼</button><span></span>
  </div>
  <button class="a" id="abtn" aria-label="Action">A</button>
</div>
<script>
(function(){
const T=16,W=30,H=23,VW=240,VH=160;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;

/* ---------- Map: Ernest Pointe ---------- */
const map=[];for(let y=0;y<H;y++){map.push(Array(W).fill('G'));}
const set=(x,y,t)=>{if(x>=0&&y>=0&&x<W&&y<H)map[y][x]=t};
let seed=11;const rnd=()=>(seed=(seed*1103515245+12345)&0x7fffffff)/0x7fffffff;
for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(rnd()<0.05)set(x,y,'F');
for(let x=1;x<=28;x++){set(x,1,'K');if(x%3)set(x,2,'K');}
for(let y=1;y<=21;y++){set(14,y,'P');set(15,y,'P');}
for(let x=3;x<=26;x++)set(x,10,'B');
for(let y=6;y<=9;y++)set(6,y,'P');
for(let x=4;x<=8;x++){set(x,3,'R');set(x,4,'H');set(x,5,'H');}
set(6,5,'D');set(7,7,'S');
for(let x=19;x<=23;x++){set(x,5,'U');set(x,6,'H');set(x,7,'H');}
set(21,7,'D');set(21,8,'P');set(21,9,'P');
for(let y=12;y<=15;y++)for(let x=19;x<=24;x++)set(x,y,'O');
for(let y=16;y<=17;y++)for(let x=18;x<=25;x++)set(x,y,'O');
for(let y=11;y<=15;y++)for(let x=3;x<=8;x++)set(x,y,'O');
for(let y=12;y<=15;y++){set(18,y,'K');set(25,y,'K');}
set(17,11,'S');set(13,16,'S');
for(let y=3;y<=7;y++)for(let x=10;x<=12;x++)set(x,y,'T');
for(let y=3;y<=9;y++)for(let x=25;x<=28;x++)set(x,y,'T');
for(let y=12;y<=21;y++)set(28,y,'T');
for(let y=16;y<=21;y++)for(let x=2;x<=13;x++)set(x,y,'g');
set(13,16,'S');
for(let x=0;x<W;x++){set(x,0,'T');set(x,H-1,'T');}
for(let y=0;y<H;y++){set(0,y,'T');set(W-1,y,'T');}
set(14,0,'P');set(15,0,'P');set(14,H-1,'P');set(15,H-1,'P');
for(let y=8;y<=9;y++)set(21,y,'s');
for(let x=19;x<=24;x++)set(x,11,'s');
for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(map[y][x]==='G'&&(x*7+y*13)%9===0)set(x,y,'V');
/* props: lamps flank the road, fence along the road, bench by the spring, barrels by the bathhouse, firewood and flower pot by the cabin */
set(13,9,'L');set(16,9,'L');for(let x=8;x<=12;x++)set(x,9,'Z');
set(26,11,'N');set(24,8,'Q');set(18,9,'Q');set(8,6,'Y');set(5,6,'X');
/* building details: windows flank each door, chimney on the cabin roof */
set(5,5,'J');set(7,5,'J');set(7,3,'C');set(20,7,'J');set(22,7,'J');
const TEXT={'7,7':'Grandma’s Cabin. Weary travelers always welcome.','17,11':'Hot springs. Rinse off first, then soak as long as you like.','13,16':'Welcome to Ernest Pointe. Mountain mist keeps our waters warm.','6,5':'The cabin door is locked. Grandma is out pickin\' berries.','21,7':'The bathhouse opens in the morning. Come back soon.'};
/* day and night versions of door text: TEXT holds the default, TEXT_ALT overrides it for one time of day */
const TEXT_ALT={day:{'21,7':'Bathhouse closed due to poor quality standards of water being too wet. Come back soon.'},night:{'6,5':"Grandma is asleep.\nGo Home !!"}};
const SOLID=new Set(['T','R','H','D','S','K','U','O','L','N','Q','Y','X','Z','J','C']);

/* ---------- Tiles (drawn in code, GBA-style limited palette) ---------- */
const C={g1:'#58b848',g2:'#48a038',g3:'#78d060',p1:'#e0c890',p2:'#c8a868',t1:'#206020',t2:'#389038',t3:'#184818',w1:'#4888f0',w2:'#80b8f8',r1:'#c84838',r2:'#903028',h1:'#f0e4b8',h2:'#c8b078',d1:'#684020',k:'#202020',wd:'#a07038'};
function mk(fn){const c=document.createElement('canvas');c.width=c.height=T;const x=c.getContext('2d');fn(x);return c}
const px=(x,c,a,b,w=1,h=1)=>{x.fillStyle=c;x.fillRect(a,b,w,h)};
const grassBase=x=>{px(x,C.g1,0,0,16,16);[[2,3],[9,2],[12,9],[5,12],[14,14],[1,8]].forEach(([a,b])=>{px(x,C.g2,a,b,2,1);px(x,C.g3,a+1,b-1,1,1)})};
const tiles={
G:mk(grassBase),
F:mk(x=>{grassBase(x);px(x,'#f8f8f8',4,5,3,3);px(x,'#f8d038',5,6,1,1);px(x,'#f0a0c0',10,10,3,3);px(x,'#f8d038',11,11,1,1)}),
g:mk(x=>{px(x,C.g2,0,0,16,16);for(let i=0;i<4;i++)for(let j=0;j<4;j++){const a=i*4,b=j*4;px(x,C.t1,a+1,b+1,1,3);px(x,C.g3,a+2,b,1,3);px(x,C.t2,a+3,b+1,1,2)}}),
P:mk(x=>{px(x,C.p1,0,0,16,16);[[3,4],[10,3],[6,10],[13,12],[2,14]].forEach(([a,b])=>px(x,C.p2,a,b,2,1))}),
T:mk(x=>{grassBase(x);px(x,C.t3,1,1,14,14);px(x,C.t1,2,1,12,12);px(x,C.t2,4,3,4,3);px(x,C.t2,9,7,4,3);px(x,C.d1,6,12,4,4)}),
W:mk(x=>{px(x,C.w1,0,0,16,16);[[2,4,5],[9,10,5],[4,13,4]].forEach(([a,b,w])=>px(x,C.w2,a,b,w,1))}),
R:mk(x=>{px(x,C.r1,0,0,16,16);for(let j=0;j<16;j+=4)px(x,C.r2,0,j+3,16,1);px(x,C.k,0,15,16,1)}),
H:mk(x=>{px(x,C.h1,0,0,16,16);px(x,C.h2,0,0,16,1);for(let j=3;j<16;j+=4)px(x,C.h2,0,j,16,1);px(x,C.h2,7,0,1,16)}),

};
Object.assign(C,{k1:'#9aa0b0',k2:'#707888',k3:'#bcc4d0',o1:'#58d0c8',o2:'#a8f4ec',b1:'#b88848',b2:'#8a6030',u1:'#4868a8',u2:'#304880'});
tiles.T=mk(x=>{grassBase(x);px(x,C.d1,7,12,2,4);px(x,C.t3,2,9,12,3);px(x,C.t1,3,9,10,2);px(x,C.t3,3,6,10,3);px(x,C.t1,4,6,8,2);px(x,C.t3,5,3,6,3);px(x,C.t2,6,3,4,2);px(x,C.t2,7,0,2,3)});
tiles.K=mk(x=>{px(x,C.k1,0,0,16,16);px(x,C.k3,2,2,6,3);px(x,C.k3,9,8,5,3);px(x,C.k2,0,12,16,4);px(x,C.k2,6,6,1,5);px(x,C.k2,12,2,1,5)});
tiles.O=mk(x=>{px(x,C.o1,0,0,16,16);px(x,C.o2,2,4,5,1);px(x,C.o2,9,10,5,1);px(x,C.o2,4,13,4,1)});
tiles.B=mk(x=>{px(x,C.b1,0,0,16,16);for(let j=3;j<16;j+=4)px(x,C.b2,0,j,16,1);px(x,C.b2,3,0,1,3);px(x,C.b2,11,4,1,3);px(x,C.b2,6,8,1,3);px(x,C.b2,13,12,1,3)});
tiles.U=mk(x=>{px(x,C.u1,0,0,16,16);for(let j=0;j<16;j+=4)px(x,C.u2,0,j+3,16,1);px(x,C.k,0,15,16,1)});
tiles.V=tiles.G;tiles.s=tiles.P;
tiles.TT=tiles.T;tiles.KF=tiles.K;
['L','N','Q','Y','X','Z'].forEach(k=>tiles[k]=tiles.G);
tiles.Hs=tiles.H;tiles.Ds=tiles.D;tiles.J=tiles.H;tiles.Js=tiles.H;tiles.C=tiles.R;
['Otl','Otr','Obl','Obr','On','Os','Ow','Oe','Wa0','Wa1','Wa2','Wa3'].forEach(k=>tiles[k]=tiles.O);
/* ---------- Real tileset (master tileset Bellum_4a53c5.png, 16x16 cells; every tile comes from this one sheet) ---------- */
const SHEET=new Image();
SHEET.onload=()=>{
  const cut=(n,r=0)=>mk(x=>x.drawImage(SHEET,n*T,r*T,T,T,0,0,T,T));
  const flipV=(n,r)=>mk(x=>{x.translate(0,T);x.scale(1,-1);x.drawImage(SHEET,n*T,r*T,T,T,0,0,T,T)});
  tiles.G=cut(0);tiles.V=cut(1);tiles.F=cut(2);tiles.P=cut(3);tiles.g=cut(4);tiles.B=cut(5);tiles.s=cut(6);
  const onGrass=(n,r)=>mk(x=>{x.drawImage(tiles.G,0,0);x.drawImage(SHEET,n*T,r*T,T,T,0,0,T,T)});
  tiles.T=onGrass(0,1);tiles.TT=onGrass(1,1);          /* pine canopy, pine trunk */
  tiles.KF=cut(2,1);tiles.K=cut(3,1);                  /* cliff face, rock top */
  for(let i=0;i<4;i++)tiles['Wa'+i]=cut(4+i,1);        /* water animation frames */
  tiles.On=cut(0,2);tiles.Os=cut(1,2);tiles.Ow=cut(2,2);tiles.Oe=cut(3,2);
  tiles.Otl=cut(4,2);tiles.Otr=cut(5,2);
  tiles.Obl=flipV(4,2);tiles.Obr=flipV(5,2);           /* temporary: flipped top corners */
  tiles.S=onGrass(0,4);tiles.Z=onGrass(1,4);tiles.L=onGrass(2,4);tiles.N=onGrass(3,4);  /* row 5: sign, fence, lamp post, bench */
  tiles.Q=onGrass(4,4);tiles.Y=onGrass(5,4);tiles.X=onGrass(6,4);                       /* row 5: barrels, firewood, flower pot */
  /* row 4: buildings. Cabin (left of column 12) = wood walls, red roof, green-framed windows, chimney.
     Bathhouse (column 12 and right) = stone walls, teal roof, blue windows. */
  const over=(base,n,r)=>mk(x=>{x.drawImage(base,0,0);x.drawImage(SHEET,n*T,r*T,T,T,0,0,T,T)});
  const wood=cut(2,3),stone=cut(3,3);
  tiles.R=cut(0,3);tiles.U=cut(1,3);
  tiles.H=wood;tiles.Hs=stone;
  tiles.D=over(wood,4,3);tiles.Ds=over(stone,4,3);
  tiles.J=over(wood,5,3);tiles.Js=over(stone,6,3);
  tiles.C=over(tiles.R,7,3);
};

/* ---------- Player ---------- */
const P={x:14*T,y:8*T,dir:'down',moving:false,step:0,turn:0,tx:0,ty:0,anim:0};
const CYCLE_MS=6*60*1000;   /* hidden game clock: day and night swap every 6 real minutes */
let night=false,qCount=0,qLast=0,nextFlip=performance.now()+CYCLE_MS;const dark=document.createElement('canvas');dark.width=240;dark.height=160;const dctx=dark.getContext('2d');   /* night: secret Q toggle, darkness layer */

const DIR={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function drawPlayer(sx,sy){
  const d=P.dir,f=P.moving?(Math.floor(P.anim/8)%2):0,bob=P.sitting?-1:(P.moving&&f===1?-1:0);
  const r=(c,a,b,w,h)=>px(ctx,c,sx+a,sy+b+bob,w,h);
  if(!P.sitting&&!J){ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(sx+3,sy+14,10,2);}
  const lift=P.moving?1:0;
  if(!P.sitting){
  px(ctx,'#2a3c88',sx+5,sy+12+bob,2,3-(f===1?lift:0));
  px(ctx,'#2a3c88',sx+9,sy+12+bob,2,3-(f===0&&P.moving?lift:0));}
  r('#3868d8',4,7,8,6);r('#f8f8f8',7,7,2,6);

  if(d==='right'){r(C.k,10,5,1,2)}
  if(d==='up'){r('#5a3a20',5,3,6,5)}
  r('#d83830',4,1,8,3);r('#d83830',4,3,8,1);r('#f8f8f8',7,1,2,2);
  if(d==='down')r('#a02820',4,3,8,2);
  if(d==='left')r('#a02820',2,3,8,1);
  if(d==='right')r('#a02820',6,3,8,1);
}

/* ---------- Input ---------- */
const keys={up:false,down:false,left:false,right:false};
const KM={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
const order=[];
function press(k,v){
  let skip=false;
  if(v&&!keys[k]){
    if(P.sitting){leaveBench(k);skip=true}
    else if(msg.open){if(k===P.dir){action();skip=true}}   /* arrow toward the thing being read = Z (skip typing / close) */
    else if(!msg.open&&!P.moving&&!J){
      /* pressing an arrow toward an adjacent bench acts like pressing Z on it; toward a barrel or firewood stack hops over it */
      const tx=Math.round(P.x/T)+DIR[k][0],ty=Math.round(P.y/T)+DIR[k][1];
      const t=map[ty]&&map[ty][tx];
      if(t==='N')sit(tx,ty);
      else if(t==='Q'||t==='Y')tryJump(k,tx,ty);
      else if(TEXT[tx+','+ty]){   /* arrow toward anything readable (any tile with text) reads it, like Z */
        P.dir=k;P.turn=0;openMsg(readText(tx+','+ty));skip=true;
      }
    }
  }
  keys[k]=v;const i=order.indexOf(k);if(v&&i<0&&!skip)order.push(k);if(!v&&i>=0)order.splice(i,1)}
addEventListener('keydown',e=>{
  if(KM[e.code]){press(KM[e.code],true);e.preventDefault()}
  if((e.code==='KeyZ'||e.code==='Space'||e.code==='Enter')&&!e.repeat){action();e.preventDefault()}
  /* secret testing toggle: Q three times in a row flips day <-> night; any other key breaks the streak */
  if(e.code!=='KeyQ')qCount=0;
  else if(!e.repeat){const now=performance.now();if(now-qLast>20000)qCount=0;qLast=now;if(++qCount>=3){night=!night;qCount=0;nextFlip=now+CYCLE_MS}   /* a manual flip restarts the 6 minute clock */e.preventDefault()}   /* 20 seconds since the last Q resets the count */
});
addEventListener('keyup',e=>{if(KM[e.code])press(KM[e.code],false)});
document.querySelectorAll('.pad button').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();press(k,true)});
  ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>press(k,false)));
});
document.getElementById('abtn').addEventListener('pointerdown',e=>{e.preventDefault();action()});

/* ---------- Dialogue ---------- */
const msg={text:'',shown:0,open:false};
function readText(k){return (TEXT_ALT[night?'night':'day'][k])||TEXT[k]}
/* long messages are split into pages of 3 lines; the action key moves to the next page */
function openMsg(t){
  const L=wrap(t,25),pages=[];
  for(let i=0;i<L.length;i+=3)pages.push(L.slice(i,i+3).join('\n'));
  msg.text=pages.shift();msg.rest=pages;msg.shown=0;msg.open=true;
}
/* wraps text to n characters per line; a \n in the text forces a line break */
function wrap(t,n){const L=[];t.split('\n').forEach(seg=>{let l='';seg.split(' ').forEach(s=>{if((l+' '+s).trim().length>n){L.push(l);l=s}else l=(l+' '+s).trim()});L.push(l)});return L}
function action(){
  if(msg.open){if(msg.shown<msg.text.length)msg.shown=msg.text.length;else if(msg.rest&&msg.rest.length){msg.text=msg.rest.shift();msg.shown=0}else msg.open=false;return}
  if(P.moving||J)return;
  if(P.sitting){standUp();return}
  const [dx,dy]=DIR[P.dir];
  const tx=Math.round(P.x/T)+dx,ty=Math.round(P.y/T)+dy;
  const k=tx+','+ty,tt=map[ty]&&map[ty][tx];
  if(tt==='N'){sit(tx,ty);return}
  if(TEXT[k])openMsg(readText(k));
}
/* sitting on benches: Z/Space/Enter stands back up where you came from; an arrow key gets off on that side of the bench (does nothing if that side is blocked) */
function leaveBench(k){
  const tx=Math.round(P.x/T)+DIR[k][0],ty=Math.round(P.y/T)+DIR[k][1];
  if(blocked(tx,ty))return;
  P.x=tx*T;P.y=ty*T;P.dir=k;P.sitting=false;order.length=0;
}
function sit(tx,ty){P.sitFrom=[Math.round(P.x/T),Math.round(P.y/T)];P.x=tx*T;P.y=ty*T;P.dir='down';P.anim=0;P.sitting=true}
function standUp(){const f=P.sitFrom||[Math.round(P.x/T),Math.round(P.y/T)+1];P.x=f[0]*T;P.y=f[1]*T;P.dir='down';P.sitting=false}
/* ---------- Barrel hop: arrow toward an adjacent barrel jumps straight over it (no diagonals) ---------- */
function puff(wx,wy){for(let i=0;i<6;i++)dust.push({x:wx+(Math.random()-.5)*8,y:wy-Math.random()*2,vx:(Math.random()-.5)*.8,vy:-.2-Math.random()*.4,life:14})}
function tryJump(k,bx,by){
  const lx=bx+DIR[k][0],ly=by+DIR[k][1];
  if(blocked(lx,ly))return;             /* landing spot blocked: do nothing */
  P.dir=k;P.turn=0;
  J={t:0,dur:26,sx:P.x,sy:P.y,ex:lx*T,ey:ly*T,k:k};
  puff(P.x+8,P.y+15);
}
function drawJump(cx,cy){
  const k=J.t/J.dur,h=Math.sin(Math.PI*k),lift=h*(J.hop||18),s=k*k*(3-2*k);
  const fx=Math.round(P.x-cx+8),fy=Math.round(P.y-cy+16);
  const sw=Math.round(10-4*h);
  ctx.fillStyle='rgba(0,0,0,'+(0.26-0.12*h).toFixed(2)+')';ctx.fillRect(fx-(sw>>1),fy-2,sw,2);   /* ground shadow shrinks as you rise */
  const q=Math.min(4,Math.floor(s*4.2)),dx=DIR[J.k][0];
  ctx.save();ctx.translate(fx,Math.round(fy-lift-8));
  if(J.hop){}else if(dx!==0)ctx.rotate(dx*q*Math.PI/2);          /* sideways hop: a full tumble in 90 degree steps */
  else ctx.scale([1,.5,-1,-.5,1][q],1);            /* up/down hop: a pirouette */
  drawPlayer(-8,-8);
  ctx.restore();
}
/* ---------- Startled hop: each step onto tall grass has a 30% chance to make the player hop in place and shout ---------- */
const GRASS_SCARE=0.3,SHOUTS=['YAAAH!','EEK!','WHOA!','HIYAH!','YIKES!'];
function startle(){
  J={t:0,dur:18,sx:P.x,sy:P.y,ex:P.x,ey:P.y,k:P.dir,hop:14};
  shout={text:SHOUTS[Math.floor(Math.random()*SHOUTS.length)],t:45};
  puff(P.x+8,P.y+15);
}
function drawShout(cx,cy){
  const w=shout.text.length*8+8,h=14;
  const hx=Math.round(P.x-cx+8);
  const lift=J&&J.hop?Math.sin(Math.PI*J.t/J.dur)*J.hop:0;
  let bx=Math.round(hx-w/2),by=Math.round(P.y-cy-h-6-lift);
  bx=Math.max(2,Math.min(VW-w-2,bx));by=Math.max(2,by);
  ctx.fillStyle='#202020';ctx.fillRect(bx-1,by-1,w+2,h+2);
  ctx.fillStyle='#f8f8f8';ctx.fillRect(bx,by,w,h);
  ctx.fillRect(hx-1,by+h,3,1);                                   /* speech tail */
  ctx.fillStyle='#202020';ctx.fillRect(hx-2,by+h+1,1,1);ctx.fillRect(hx+2,by+h+1,1,1);ctx.fillRect(hx-1,by+h+2,1,1);ctx.fillRect(hx+1,by+h+2,1,1);ctx.fillRect(hx,by+h+3,1,1);
  ctx.fillStyle='#f8f8f8';ctx.fillRect(hx-1,by+h+1,3,1);ctx.fillRect(hx,by+h+2,1,1);
  ctx.font='8px "Press Start 2P",monospace';ctx.textBaseline='top';ctx.fillStyle='#d83830';
  ctx.fillText(shout.text,bx+4,by+3);
}
function drawBox(){
  const bx=4,by=VH-44,bw=VW-8,bh=40;
  ctx.fillStyle='#202020';ctx.fillRect(bx-1,by-1,bw+2,bh+2);
  ctx.fillStyle='#f8f8f8';ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle='#585878';ctx.fillRect(bx+2,by+2,bw-4,1);ctx.fillRect(bx+2,by+bh-3,bw-4,1);
  ctx.fillRect(bx+2,by+2,1,bh-4);ctx.fillRect(bx+bw-3,by+2,1,bh-4);
  ctx.font='8px "Press Start 2P",monospace';ctx.textBaseline='top';ctx.fillStyle='#202020';
  const lines=wrap(msg.text.slice(0,msg.shown),25);
  lines.slice(-3).forEach((l,i)=>ctx.fillText(l,bx+8,by+8+i*10));
  if(msg.shown>=msg.text.length&&(frame>>4)%2===0){ctx.fillStyle='#d83830';ctx.fillRect(bx+bw-14,by+bh-12,6,4)}
}

/* ---------- Update / Draw ---------- */
let frame=0,rustle=0;
const SPEED=2;
function blocked(tx,ty){return tx<0||ty<0||tx>=W||ty>=H||SOLID.has(map[ty][tx])}
function update(){
  frame++;
  const clock=performance.now();while(clock>=nextFlip){night=!night;nextFlip+=CYCLE_MS}   /* catches up if the tab was asleep */
  for(let i=dust.length-1;i>=0;i--){const d=dust[i];d.x+=d.vx;d.y+=d.vy;if(--d.life<=0)dust.splice(i,1)}
  if(shout&&--shout.t<=0)shout=null;
  if(J){
    J.t++;const k=J.t/J.dur;
    P.x=Math.round(J.sx+(J.ex-J.sx)*k);P.y=Math.round(J.sy+(J.ey-J.sy)*k);P.anim=0;
    if(J.t>=J.dur){P.x=J.ex;P.y=J.ey;puff(P.x+8,P.y+15);J=null}
    return;
  }
  if(msg.open){if(msg.shown<msg.text.length&&frame%2===0)msg.shown++;return}
  if(P.sitting)return;
  if(P.moving){
    P.x+=DIR[P.dir][0]*SPEED;P.y+=DIR[P.dir][1]*SPEED;P.anim++;
    if(P.x===P.tx*T&&P.y===P.ty*T){
      P.moving=false;
      if(map[P.ty][P.tx]==='g'){
        rustle=10;
        if(Math.random()<GRASS_SCARE){startle();return}   /* 30% chance: hop and shout */
      }
    }
    if(P.moving)return;
  }
  const want=order.length?order[order.length-1]:null;
  if(!want){P.anim=0;return}
  if(P.dir!==want){P.dir=want;P.turn=6;return}
  if(P.turn>0){P.turn--;return}
  const tx=Math.round(P.x/T)+DIR[want][0],ty=Math.round(P.y/T)+DIR[want][1];
  if(!blocked(tx,ty)){P.moving=true;P.tx=tx;P.ty=ty}
}
function poolTile(x,y){
  const o=(a,b)=>map[b]&&map[b][a]==='O';
  const k=(a,b)=>map[b]&&map[b][a]==='K';  /* cliffs act as the pool wall: no shoreline against them */
  const n=!o(x,y-1)&&!k(x,y-1),s=!o(x,y+1)&&!k(x,y+1),w=!o(x-1,y)&&!k(x-1,y),e=!o(x+1,y)&&!k(x+1,y);
  if(n&&w)return tiles.Otl;if(n&&e)return tiles.Otr;if(s&&w)return tiles.Obl;if(s&&e)return tiles.Obr;
  if(n)return tiles.On;if(s)return tiles.Os;if(w)return tiles.Ow;if(e)return tiles.Oe;
  return tiles['Wa'+(Math.floor(frame/24)%4)];
}
function tileAt(x,y){
  const c=map[y][x];
  if(c==='T')return (y===0||y===H-1||(y+1<H-1&&map[y+1][x]==='T'))?tiles.T:tiles.TT;
  if(c==='K')return y===2?tiles.KF:tiles.K;
  if(c==='O')return poolTile(x,y);
  if((c==='H'||c==='D'||c==='J')&&x>=12)return tiles[c+'s'];
  return tiles[c];
}
/* ---------- Night: blue tint with stepped light pools (lamps, windows, a small glow around the player) ---------- */
function pool(c,x,y,r,steps,a){c.globalAlpha=a;for(let i=steps;i>=1;i--){c.beginPath();c.arc(x,y,r*i/steps,0,6.2832);c.fill()}c.globalAlpha=1}
/* darkness level 0 (full day) to 1 (full night). Dusk and dawn: it ramps over the last 45 seconds before each switch, so the switch itself is seamless. */
const DUSK_MS=45*1000;
function nightLevel(){const ramp=Math.min(1,Math.max(0,1-(nextFlip-performance.now())/DUSK_MS));return night?1-ramp:ramp}
function drawNight(cx,cy,lv){
  const x0=Math.floor(cx/T)-3,x1=Math.floor((cx+VW)/T)+3,y0=Math.floor(cy/T)-3,y1=Math.floor((cy+VH)/T)+3;
  const flick=Math.sin(frame/9)*1.2+Math.sin(frame/23)*0.8;
  const lamps=[],wins=[];
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const c=map[y]&&map[y][x];
    if(c==='L')lamps.push([x*T-cx+8,y*T-cy+5]);
    else if(c==='J')wins.push([x*T-cx+8,y*T-cy+8]);
  }
  dctx.globalCompositeOperation='source-over';dctx.globalAlpha=1;dctx.clearRect(0,0,VW,VH);
  dctx.fillStyle='rgba(12,16,58,'+(0.68*lv).toFixed(3)+')';dctx.fillRect(0,0,VW,VH);
  dctx.globalCompositeOperation='destination-out';dctx.fillStyle='#000';
  lamps.forEach(l=>pool(dctx,l[0],l[1],34+flick,4,.3));
  wins.forEach(w=>pool(dctx,w[0],w[1],16,3,.3));
  pool(dctx,P.x-cx+8,P.y-cy+8,20,3,.2);
  dctx.globalCompositeOperation='source-over';
  ctx.drawImage(dark,0,0);
  ctx.globalCompositeOperation='lighter';
  ctx.fillStyle='rgb(255,176,80)';lamps.forEach(l=>pool(ctx,l[0],l[1],30+flick,4,.05*lv));
  ctx.fillStyle='rgb(255,214,110)';wins.forEach(w=>pool(ctx,w[0],w[1],13,3,.07*lv));
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
}
function draw(){
  let cx=Math.round(P.x+T/2-VW/2),cy=Math.round(P.y+T/2-VH/2);
  cx=Math.max(0,Math.min(W*T-VW,cx));cy=Math.max(0,Math.min(H*T-VH,cy));
  ctx.fillStyle='#000';ctx.fillRect(0,0,VW,VH);
  const x0=Math.floor(cx/T),y0=Math.floor(cy/T);
  for(let y=y0;y<=y0+VH/T+1;y++)for(let x=x0;x<=x0+VW/T+1;x++){
    if(x<0||y<0||x>=W||y>=H)continue;
    ctx.drawImage(tileAt(x,y),x*T-cx,y*T-cy);
  }
  dust.forEach(d=>{ctx.fillStyle='rgba(248,248,248,'+(d.life/14*.7).toFixed(2)+')';ctx.fillRect(Math.round(d.x-cx),Math.round(d.y-cy),2,2)});
  if(J)drawJump(cx,cy);else drawPlayer(P.x-cx,P.y-cy);
  if(P.sitting)ctx.drawImage(tiles.N,0,10,16,6,P.x-cx,P.y-cy+10,16,6);
  // tall grass overlay drawn over the player's feet
  const gx=Math.round(P.x/T),gy=Math.round(P.y/T);
  if(map[gy]&&map[gy][gx]==='g'&&!P.moving||rustle>0){
    const ox=gx*T-cx,oy=gy*T-cy;
    ctx.drawImage(tiles.g,0,8,16,8,ox,oy+8,16,8);
    if(rustle>0)rustle--;
  }
  for(let y=y0;y<=y0+VH/T+1;y++)for(let x=x0;x<=x0+VW/T+1;x++){
    if(!map[y]||map[y][x]!=='O')continue;
    for(let i=0;i<2;i++){const t=((frame*0.4+x*13+y*7+i*20)%40)/40;
      ctx.fillStyle='rgba(255,255,255,'+((1-t)*0.45).toFixed(2)+')';
      ctx.fillRect(x*T-cx+3+i*7+Math.round(Math.sin(t*6+i)*2),y*T-cy+8-Math.round(t*14),5,3)}
  }
  const lv=nightLevel();if(lv>0.01)drawNight(cx,cy,lv);
  if(frame<200){ctx.globalAlpha=frame>170?(200-frame)/30:1;
    ctx.fillStyle='#202020';ctx.fillRect(3,3,122,16);ctx.fillStyle='#f8f8f8';ctx.fillRect(4,4,120,14);
    ctx.font='8px "Press Start 2P",monospace';ctx.textBaseline='top';ctx.fillStyle='#202020';ctx.fillText('Ernest Pointe',9,8);ctx.globalAlpha=1}
  if(shout)drawShout(cx,cy);
  if(msg.open)drawBox();
}

/* ---------- Loop (fixed 60 updates/sec) ---------- */
let last=performance.now(),acc=0;
function loop(t){
  acc+=Math.min(100,t-last);last=t;
  while(acc>=1000/60){update();acc-=1000/60}
  draw();requestAnimationFrame(loop);
}
function fit(){
  const padH=matchMedia('(hover:hover) and (pointer:fine)').matches?90:290;
  const s=Math.max(1,Math.floor(Math.min((innerWidth-24)/VW,(innerHeight-padH)/VH)));
  cv.style.width=VW*s+'px';cv.style.height=VH*s+'px';
}
addEventListener('resize',fit);fit();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
